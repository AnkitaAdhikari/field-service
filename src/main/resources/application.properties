spring.application.name=field-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/field_service_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

invoice.base-rate=50.00
invoice.tax-rate=0.08

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.sms-from-number=${TWILIO_SMS_FROM_NUMBER:+10000000000}
twilio.whatsapp-from-number=${TWILIO_WHATSAPP_FROM_NUMBER:whatsapp:+14155238886}



logging.file.name=logs/field-service.log